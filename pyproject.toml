[project]
name = "ctfagent"
version = "0.1.0"
description = "Local AI-powered CTF challenge workspace"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=23.2.1",
    "docker>=7.1.0",
    "fastapi>=0.116.2",
    "inquirerpy>=0.3.4",
    "jinja2>=3.1.2",
    "openai>=2.0.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "requests>=2.31.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "httpx>=0.28"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
