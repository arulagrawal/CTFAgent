services:
  ctf-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_SERVICE_TIER: ${OPENAI_SERVICE_TIER:-default}
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ctf-data:/app/data
      - ../data/writeups:/app/data/writeups
    depends_on:
      ctf-solver-image:
        condition: service_completed_successfully
  ctf-solver-image:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${SOLVER_TARGET:-standard}
      args:
        BASE_IMAGE: ${SOLVER_BASE_IMAGE:-ubuntu:24.04}
    image: ctf-agent:latest
    command: ["/bin/true"]

volumes:
  ctf-data:
