<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}CTF Agent{% endblock %}</title>
<script>try{const t=localStorage.getItem('theme')||'system';document.documentElement.dataset.theme=t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t}catch(e){}</script>
<link rel="stylesheet" href="/static/app.css?v={{ STATIC_VERSION }}"><link rel="icon" href="/static/favicon.svg">
<script defer src="/static/shared.js?v={{ STATIC_VERSION }}"></script>{% block scripts %}{% endblock %}</head>
<body><header class="shell-header"><a class="brand" href="/">◈ <span>CTF Agent<small>Challenge workspace</small></span></a><nav aria-label="Main navigation"><a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Workspace</a><a href="/dashboard" {% if request.url.path == '/dashboard' %}aria-current="page"{% endif %}>Sessions</a><a href="/docs">API</a></nav><label class="theme-label">Theme<select id="theme" aria-label="Color theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label></header>
<main>{% block content %}{% endblock %}</main><div id="toast" role="status" hidden></div></body></html>
